name: entry_kit
description: A production-ready authentication UI package. Decouples UI from logic with interfaces for Google & Apple auth.
version: 0.1.0 # Bumped for publication
homepage: https://github.com/jeffbezosriyal/entry_kit
repository: https://github.com/jeffbezosriyal/entry_kit
issue_tracker: https://github.com/jeffbezosriyal/entry_kit/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Core Logic (Latest Stable 8.x Ecosystem)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # UI Assets
  flutter_svg: ^2.0.17

  # Auth Plugins (Latest Compatible)
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Testing (Aligned with flutter_bloc 8.x)
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/google_logo.svg