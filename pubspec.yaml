name: entry_kit
description: A production-ready authentication UI package. Decouples UI from logic with interfaces for Google & Apple auth.
version: 0.0.9 # Bumped version
homepage: https://github.com/jeffbezosriyal/entry_kit
repository: https://github.com/jeffbezosriyal/entry_kit
issue_tracker: https://github.com/jeffbezosriyal/entry_kit/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  # Core Logic
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # UI Assets
  flutter_svg: ^2.0.9

  # Authentication Plugins (Restored to fix your imports)
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/google_logo.svg