name: entry_kit
description: A production-ready, unopinionated authentication UI package for Flutter. Decouples UI from Logic with Google & Apple Auth support. # Must be 60-180 characters.
version: 0.0.5
homepage: https://github.com/jeffbezozriyal/entry_kit
repository: https://github.com/jeffbezozriyal/entry_kit # Critical for verification points
issue_tracker: https://github.com/jeffbezozriyal/entry_kit/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^6.1.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  flutter_lints: ^3.0.0 # Mandatory for score

flutter:
  assets:
    - assets/google_logo.svg