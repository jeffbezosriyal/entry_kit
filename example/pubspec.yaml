name: entry_kit_example
description: Demonstrates how to use the EntryKit authentication package.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The package itself
  entry_kit:
    path: ../

  # MISSING DEPENDENCIES (Added to fix the error)
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # FIXED SYNTAX (Indentation is critical here)
    - packages/entry_kit/assets/google_logo.svg